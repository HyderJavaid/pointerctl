name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: {label: "Version and how you installed it", description: "pointerctl --version; deb, Flatpak, pip or source"}
    validations: {required: true}
  - type: textarea
    id: command
    attributes: {label: "What you ran (or clicked) and what happened"}
    validations: {required: true}
  - type: textarea
    id: identify
    attributes: {label: "Output of `pointerctl identify`", render: text}
  - type: input
    id: distro
    attributes: {label: "Distribution and desktop"}
