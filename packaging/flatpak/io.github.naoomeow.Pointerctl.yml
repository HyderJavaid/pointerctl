app-id: io.github.naoomeow.Pointerctl
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: pointerctl-gui
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # The mouse is a hidraw device node. Flatpak cannot install udev rules, so the host still needs
  # udev/install.sh once; after that the logged-in user may open the node and this permission lets the app do so.
  - --device=all
modules:
  - name: pointerctl
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/data/io.github.naoomeow.Pointerctl.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 packaging/data/io.github.naoomeow.Pointerctl.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 packaging/data/io.github.naoomeow.Pointerctl.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
      - install -Dm644 udev/70-pointerctl.rules -t ${FLATPAK_DEST}/share/pointerctl/udev
      - install -Dm755 udev/install.sh -t ${FLATPAK_DEST}/share/pointerctl/udev
    sources:
      - type: dir
        path: ../..
